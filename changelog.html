<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>更新日志 · MyTime</title>
    <meta name="description" content="MyTime（Windows 桌面流体备忘小组件）的完整更新日志与版本路线。" />
    <meta name="author" content="蔡恩祈" />
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/CEQ151/MyTime/main/assets/logo.png" />
    <style>
      :root {
        --bg: #ffffff;
        --text: #1a1f27;
        --muted: #8a919c;
        --pill-bg: #f2f3f5;
        --pill-text: #4b5563;
        --divider: #eceef1;
        --accent: #4f7cc9;
        --card-bg: transparent;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #101216;
          --text: #e8eaed;
          --muted: #8b919b;
          --pill-bg: #1d2127;
          --pill-text: #aab1bb;
          --divider: #23272e;
          --accent: #7da4e0;
        }
      }
      html[data-theme="dark"] {
        --bg: #101216;
        --text: #e8eaed;
        --muted: #8b919b;
        --pill-bg: #1d2127;
        --pill-text: #aab1bb;
        --divider: #23272e;
        --accent: #7da4e0;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        font-size: 16px;
        line-height: 1.8;
        -webkit-font-smoothing: antialiased;
      }
      .container { max-width: 720px; margin: 0 auto; padding: 56px 24px 64px; }
      a { color: inherit; text-decoration: none; }

      .back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 14.5px;
        transition: color 0.15s ease;
      }
      .back:hover { color: var(--text); }
      h1 {
        font-size: 28px;
        font-weight: 600;
        margin-top: 18px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .app-icon { width: 40px; height: 40px; border-radius: 10px; vertical-align: -6px; }
      .subtitle { color: var(--muted); font-size: 15px; margin-top: 4px; }
      .subtitle a { border-bottom: 1px solid var(--divider); transition: border-color 0.15s ease; }
      .subtitle a:hover { border-color: var(--muted); }

      /* 时间线 */
      .timeline { margin-top: 44px; }
      .version {
        position: relative;
        padding: 0 0 44px 34px;
        border-left: 1px solid var(--divider);
      }
      .version:last-child { border-left-color: transparent; padding-bottom: 8px; }
      .version::before {
        content: "";
        position: absolute;
        left: -5px;
        top: 10px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--muted);
      }
      .version.latest::before { background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
      .version-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
      .version-tag {
        font-size: 19px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        text-decoration: none;
        transition: opacity 0.15s ease;
      }
      .version-tag:hover { opacity: 0.65; text-decoration: underline; text-underline-offset: 4px; }
      .version-date { color: var(--muted); font-size: 13.5px; }
      .latest-badge {
        background: var(--pill-bg);
        color: var(--pill-text);
        border-radius: 999px;
        font-size: 12px;
        padding: 1px 10px;
        line-height: 1.7;
      }
      .version-summary {
        color: var(--text);
        font-size: 15px;
        margin-top: 6px;
      }
      .changes { margin-top: 10px; }
      .cat {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--muted);
        margin: 14px 0 4px;
      }
      .cat.feature { color: var(--accent); }
      .changes ul { list-style: none; }
      .changes li {
        position: relative;
        padding-left: 16px;
        color: var(--pill-text);
        font-size: 14.5px;
        line-height: 1.75;
        margin-top: 4px;
      }
      .changes li::before {
        content: "";
        position: absolute;
        left: 2px;
        top: 0.85em;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--divider);
      }
      @media (prefers-color-scheme: dark) {
        .changes li::before { background: #33383f; }
      }
      .changes code {
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 13px;
        background: var(--pill-bg);
        border-radius: 5px;
        padding: 1px 6px;
      }
      .error {
        margin-top: 44px;
        color: var(--muted);
        font-size: 15px;
      }
      .error a { border-bottom: 1px solid var(--divider); }

      /* 版本截图画廊 */
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        margin-top: 16px;
      }
      .gallery a {
        display: block;
        border: 1px solid var(--divider);
        border-radius: 12px;
        overflow: hidden;
        transition: border-color 0.15s ease;
      }
      .gallery a:hover { border-color: var(--muted); }
      .gallery img {
        display: block;
        width: 100%;
        height: 150px;
        object-fit: cover;
        object-position: top;
      }
      .gallery figcaption {
        font-size: 12.5px;
        color: var(--muted);
        padding: 7px 10px;
        border-top: 1px solid var(--divider);
        line-height: 1.5;
      }
      /* 右上角悬浮切换钮（语言 / 主题）—— 与主页一致 */
      .float-controls {
        position: fixed;
        top: 22px;
        right: 22px;
        z-index: 60;
        display: flex;
        gap: 8px;
      }
      .float-btn {
        min-width: 44px;
        height: 40px;
        padding: 0 13px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--divider);
        border-radius: 999px;
        background: color-mix(in srgb, var(--bg) 78%, transparent);
        backdrop-filter: blur(8px);
        color: var(--muted);
        font-family: inherit;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition: color 0.15s ease, border-color 0.15s ease;
      }
      .float-btn:hover { color: var(--text); border-color: var(--muted); }
      .float-btn svg { width: 17px; height: 17px; }
    </style>
  </head>
  <body>
    <div class="float-controls">
      <button class="float-btn" id="lang-btn" type="button" title="Switch language">EN</button>
      <button class="float-btn" id="theme-btn" type="button" title="切换主题">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
      </button>
    </div>
    <div class="container">
      <a class="back" href="/" data-i18n="back">← 返回主页</a>
      <h1>
        <img class="app-icon" src="https://raw.githubusercontent.com/CEQ151/MyTime/main/assets/logo.png" alt="MyTime 图标" />
        <span data-i18n="title">MyTime 更新日志</span>
      </h1>
      <p class="subtitle">
        <span data-i18n="subtitle-pre">从第一个版本到现在的完整更新路线 · 下载最新版请见</span>
        <a href="/#projects" data-i18n="home">主页</a>
        <span data-i18n="or">或</span>
        <a href="https://github.com/CEQ151/MyTime/releases" target="_blank" rel="noopener">GitHub Releases</a>
      </p>

      <div class="timeline" id="timeline">
        <p class="error" id="loading" data-i18n="loading">正在加载更新日志…</p>
      </div>
    </div>

    <script>
      // Language + theme switches, same behavior as the homepage (localStorage-backed).
      (function () {
        var I18N = {
          zh: {
            "page-title": "更新日志 · MyTime",
            back: "← 返回主页",
            title: "MyTime 更新日志",
            "subtitle-pre": "从第一个版本到现在的完整更新路线 · 下载最新版请见",
            home: "主页",
            or: "或",
            loading: "正在加载更新日志…",
          },
          en: {
            "page-title": "Changelog · MyTime",
            back: "← Back to homepage",
            title: "MyTime Changelog",
            "subtitle-pre": "Every release from day one · Get the latest build from",
            home: "homepage",
            or: "or",
            loading: "Loading changelog…",
          },
        };
        var MOON = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8" />';
        var SUN = '<circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.9 4.9 1.4 1.4" /><path d="m17.7 17.7 1.4 1.4" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.3 17.7-1.4 1.4" /><path d="m19.1 4.9-1.4 1.4" />';

        var html = document.documentElement;
        var langBtn = document.getElementById("lang-btn");
        var themeBtn = document.getElementById("theme-btn");
        var themeIcon = document.getElementById("theme-icon");

        function stored(key) {
          try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function currentLang() {
          return stored("site-lang") || ((navigator.language || "").toLowerCase().indexOf("zh") === 0 ? "zh" : "en");
        }
        function currentTheme() {
          var t = stored("site-theme");
          if (t === "dark" || t === "light") return t;
          return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        function applyLang(l) {
          var entries = I18N[l] || I18N.zh;
          html.setAttribute("lang", l === "zh" ? "zh-CN" : "en");
          document.title = entries["page-title"];
          document.querySelectorAll("[data-i18n]").forEach(function (el) {
            var val = entries[el.getAttribute("data-i18n")];
            if (val !== undefined) el.textContent = val;
          });
          langBtn.textContent = l === "zh" ? "EN" : "中文";
          langBtn.title = l === "zh" ? "切换为英文" : "切换为中文";
        }

        var lang = currentLang();
        applyLang(lang);
        themeIcon.innerHTML = currentTheme() === "dark" ? SUN : MOON;

        themeBtn.addEventListener("click", function () {
          var next = currentTheme() === "dark" ? "light" : "dark";
          try { localStorage.setItem("site-theme", next); } catch (e) {}
          html.setAttribute("data-theme", next);
          themeIcon.innerHTML = next === "dark" ? SUN : MOON;
        });
        langBtn.addEventListener("click", function () {
          lang = lang === "zh" ? "en" : "zh";
          try { localStorage.setItem("site-lang", lang); } catch (e) {}
          applyLang(lang);
        });

        // Live state for the changelog renderer (error message language) and tests.
        window.__siteLang = function () { return lang; };
        window.__siteTheme = function () { return currentTheme(); };
      })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script>
      // Render the repo's CHANGELOG.md live: new releases show up here automatically,
      // no manual page edits needed. Falls back to a link if fetching/markdown fails.
      (function () {
        var RAW = "https://raw.githubusercontent.com/CEQ151/MyTime/main/CHANGELOG.md";
        var timeline = document.getElementById("timeline");

        function classify(title) {
          if (/新功能|✨/.test(title)) return "feature";
          if (/修复|🐛/.test(title)) return "fix";
          if (/性能|⚡/.test(title)) return "perf";
          return "misc";
        }

        function el(tag, cls, text) {
          var node = document.createElement(tag);
          if (cls) node.className = cls;
          if (text !== undefined) node.textContent = text;
          return node;
        }

        // Screenshots per version, from updates/gallery.json:
        // { "vX.Y.Z": [ { "file": "slug", "caption": "…" } ] } → updates/vX.Y.Z/slug.webp
        function fetchGallery() {
          return fetch("updates/gallery.json")
            .then(function (r) { return r.ok ? r.json() : {}; })
            .catch(function () { return {}; });
        }

        function addGallery(item, version, gallery) {
          var shots = gallery[version];
          if (!shots || !shots.length) return;
          var fig = document.createElement("div");
          fig.className = "gallery";
          shots.forEach(function (shot) {
            var a = document.createElement("a");
            a.href = "updates/" + version + "/" + shot.file + ".webp";
            a.target = "_blank";
            a.rel = "noopener";
            var img = document.createElement("img");
            img.src = a.href;
            img.alt = shot.caption || version;
            img.loading = "lazy";
            a.appendChild(img);
            if (shot.caption) a.appendChild(el("figcaption", null, shot.caption));
            fig.appendChild(a);
          });
          item.appendChild(fig);
        }

        // Minimal line-based parser: the changelog format is fixed
        // (## vX.Y.Z - date, optional "> summary", "### emoji 分类", "- 条目").
        function renderAll(md, gallery) {
          timeline.textContent = "";
          var sections = md.split(/^## /m).slice(1);
          var latestDone = false;
          sections.forEach(function (section) {
            var lines = section.split("\n");
            var head = lines[0].trim();
            var m = head.match(/^(v[\w.-]+)(?:\s*-\s*(.*))?$/);
            if (!m) return;
            var version = m[1];
            var date = (m[2] || "").trim();

            var item = el("div", "version");
            if (!latestDone) {
              item.classList.add("latest");
              latestDone = true;
            }
            var headRow = el("div", "version-head");
            var link = el("a", "version-tag", version);
            link.href = "https://github.com/CEQ151/MyTime/releases/tag/" + encodeURIComponent(version);
            link.target = "_blank";
            link.rel = "noopener";
            headRow.appendChild(link);
            if (date) headRow.appendChild(el("span", "version-date", date));
            if (item.classList.contains("latest")) headRow.appendChild(el("span", "latest-badge", "最新"));
            item.appendChild(headRow);

            var changes = el("div", "changes");
            var currentCat = null;
            lines.slice(1).forEach(function (line) {
              var h3 = line.match(/^###\s+(.*)$/);
              if (h3) {
                currentCat = el("div", "cat " + classify(h3[1]), h3[1].trim());
                changes.appendChild(currentCat);
                changes.appendChild(el("ul"));
                return;
              }
              var liText = line.match(/^-\s+(.*)$/);
              if (liText && currentCat) {
                var li = document.createElement("li");
                li.innerHTML = marked.parse(liText[1]);
                changes.lastChild.appendChild(li);
              } else if (/^>\s+/.test(line) && !changes.querySelector("ul")) {
                item.appendChild(el("p", "version-summary", line.replace(/^>\s+/, "").trim()));
              }
            });
            item.appendChild(changes);
            addGallery(item, version, gallery);
            timeline.appendChild(item);
          });
        }

        Promise.all([fetch(RAW), fetchGallery()])
          .then(function (results) {
            if (!results[0].ok) throw new Error(results[0].status);
            return Promise.all([results[0].text(), results[1]]);
          })
          .then(function (pair) { renderAll(pair[0], pair[1]); })
          .catch(function () {
            var p = document.getElementById("loading");
            if (p) {
              var lang = (window.__siteLang && window.__siteLang()) || "zh";
              var msgs = {
                zh: '更新日志加载失败（网络或限流原因）。你可以直接在 GitHub 上查看' +
                    '<a href="https://github.com/CEQ151/MyTime/blob/main/CHANGELOG.md" target="_blank" rel="noopener">完整更新日志</a>。',
                en: 'Failed to load the changelog (network or rate limit). Read the ' +
                    '<a href="https://github.com/CEQ151/MyTime/blob/main/CHANGELOG.md" target="_blank" rel="noopener">full changelog</a> on GitHub.',
              };
              p.innerHTML = msgs[lang] || msgs.zh;
            }
          });
      })();
    </script>
  </body>
</html>
